<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>

    <!-- Pretendard -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />

    <style>
      :root {
        --bg1: #cdd7ff;
        --bg2: #b7c3ff;
        --card1: #4b5f9e;
        --card2: #3d538f;
        --card3: #3a4f88;
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.55);
        --line: rgba(255, 255, 255, 0.18);

        --btn-blue: #4f7cff;
        --btn-pink: #ff5a8f;
        --btn-green: #20c5a5;

        --btn-disabled: rgba(10, 20, 45, 0.28);
        --btn-disabled-text: rgba(255, 255, 255, 0.35);

        --shadow: 0 28px 70px rgba(33, 45, 90, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Pretendard, system-ui, -apple-system, Segoe UI, Roboto,
          "Noto Sans KR", sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(
            1200px 600px at 50% 40%,
            rgba(255, 255, 255, 0.25),
            rgba(255, 255, 255, 0) 55%
          ),
          radial-gradient(
            900px 500px at 50% 70%,
            rgba(75, 110, 255, 0.18),
            rgba(0, 0, 0, 0) 60%
          ),
          linear-gradient(180deg, var(--bg1), var(--bg2));
      }

      .brand {
        text-align: center;
        font-weight: 700;
        letter-spacing: 0.28em;
        color: rgba(255, 255, 255, 0.85);
        font-size: 56px;
        line-height: 1;
        margin-bottom: 36px;
        text-transform: lowercase;
        user-select: none;
      }

      .wrap {
        display: grid;
        place-items: center;
        gap: 22px;
      }

      .card {
        width: min(520px, 92vw);
        padding: 34px 36px 30px;
        border-radius: 18px;
        background: linear-gradient(180deg, var(--card1), var(--card2));
        box-shadow: var(--shadow);
        position: relative;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 18px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.10),
          rgba(255, 255, 255, 0.04)
        );
        pointer-events: none;
      }

      .title {
        position: relative;
        text-align: center;
        font-size: 24px;
        font-weight: 800;
        color: var(--text);
        margin: 0 0 18px;
      }

      .divider {
        position: relative;
        height: 1px;
        background: rgba(0, 0, 0, 0.18);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        margin: 0 0 26px;
      }

      .time-grid {
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto 1fr auto 1fr;
        align-items: center;
        gap: 14px;
        justify-items: center;
        margin-bottom: 26px;
      }

      .unit {
        position: relative;
        width: 120px;
      }

      .unit-label {
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 8px;
        letter-spacing: 0.08em;
      }

      .box {
        height: 84px;
        border-radius: 10px;
        background: linear-gradient(180deg, #425894, #3a4f88);
        border: 1px solid rgba(0, 0, 0, 0.25);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12),
          inset 0 -10px 24px rgba(0, 0, 0, 0.22);
        display: grid;
        place-items: center;
      }

      .box input {
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        background: transparent;
        text-align: center;
        font-size: 48px;
        font-weight: 800;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }

      /* number input spinners 제거 */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }

      .colon {
        width: 8px;
        height: 42px;
        position: relative;
        opacity: 0.65;
      }
      .colon::before,
      .colon::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
      }
      .colon::before {
        top: 10px;
      }
      .colon::after {
        bottom: 10px;
      }

      .btn-row {
        position: relative;
        display: flex;
        justify-content: center;
        gap: 14px;
      }

      .btn {
        border: 0;
        cursor: pointer;
        height: 48px;
        min-width: 160px;
        padding: 0 18px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.95);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 10px 22px rgba(0, 0, 0, 0.22);
        transition: transform 0.06s ease, filter 0.15s ease, opacity 0.15s ease;
        user-select: none;
      }
      .btn:active {
        transform: translateY(1px);
      }

      .btn.blue {
        background: linear-gradient(180deg, rgba(79, 124, 255, 1), rgba(64, 102, 220, 1));
      }
      .btn.pink {
        background: linear-gradient(180deg, rgba(255, 90, 143, 1), rgba(225, 72, 120, 1));
      }
      .btn.green {
        background: linear-gradient(180deg, rgba(32, 197, 165, 1), rgba(18, 165, 139, 1));
      }

      .btn:disabled {
        cursor: not-allowed;
        background: var(--btn-disabled);
        color: var(--btn-disabled-text);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        opacity: 0.9;
      }
      .btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        opacity: 0.95;
      }

      .footer {
        text-align: center;
        color: rgba(0, 0, 0, 0.25);
        font-weight: 700;
        letter-spacing: 0.04em;
        user-select: none;
      }

      @media (max-width: 520px) {
        .brand {
          font-size: 46px;
        }
        .unit {
          width: 98px;
        }
        .box {
          height: 76px;
        }
        .box input {
          font-size: 42px;
        }
        .btn {
          min-width: 140px;
        }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="brand">weniv</div>

      <section class="card" aria-label="timer">
        <h1 class="title">TIMER</h1>
        <div class="divider"></div>

        <div class="time-grid">
          <div class="unit">
            <div class="unit-label">HRS</div>
            <div class="box">
              <input id="hrs" type="number" inputmode="numeric" min="0" max="99" placeholder="00" />
            </div>
          </div>

          <div class="colon" aria-hidden="true"></div>

          <div class="unit">
            <div class="unit-label">MIN</div>
            <div class="box">
              <input id="min" type="number" inputmode="numeric" min="0" max="59" placeholder="00" />
            </div>
          </div>

          <div class="colon" aria-hidden="true"></div>

          <div class="unit">
            <div class="unit-label">SEC</div>
            <div class="box">
              <input id="sec" type="number" inputmode="numeric" min="0" max="59" placeholder="00" />
            </div>
          </div>
        </div>

        <div class="btn-row">
          <button id="btnStart" class="btn blue" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z"></path>
            </svg>
            <span id="startText">START</span>
          </button>

          <button id="btnReset" class="btn pink" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 5a7 7 0 1 1-6.3 4H3l3.5-3.5L10 9H7.8A5 5 0 1 0 12 7c1.1 0 2.1.35 3 .94l1.2-1.6A6.9 6.9 0 0 0 12 5z"
              ></path>
            </svg>
            RESET
          </button>
        </div>
      </section>

      <div class="footer">© WENIV CORP.</div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      const inpH = $("hrs");
      const inpM = $("min");
      const inpS = $("sec");

      const btnStart = $("btnStart");
      const btnReset = $("btnReset");
      const startText = $("startText");

      let timerId = null;
      let totalSeconds = 0;
      let isRunning = false;

      const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

      function pad2(n) {
        return String(n).padStart(2, "0");
      }

      function setInputsDisabled(disabled) {
        inpH.disabled = disabled;
        inpM.disabled = disabled;
        inpS.disabled = disabled;
      }

      function syncInputsFromTotal() {
        const t = Math.max(0, totalSeconds);
        const h = Math.floor(t / 3600);
        const m = Math.floor((t % 3600) / 60);
        const s = t % 60;

        inpH.value = pad2(h);
        inpM.value = pad2(m);
        inpS.value = pad2(s);
      }

      function readTotalFromInputs() {
        // 빈 값은 0
        const h = Number(inpH.value || 0);
        const m = Number(inpM.value || 0);
        const s = Number(inpS.value || 0);

        if (![h, m, s].every((v) => Number.isFinite(v) && v >= 0)) return 0;

        // min/sec는 0~59로 제한 (시안 느낌)
        const hh = clamp(Math.floor(h), 0, 99);
        const mm = clamp(Math.floor(m), 0, 59);
        const ss = clamp(Math.floor(s), 0, 59);

        return hh * 3600 + mm * 60 + ss;
      }

      function updateButtons() {
        const hasTime = readTotalFromInputs() > 0 || totalSeconds > 0;

        if (!isRunning) {
          btnStart.disabled = !hasTime;
          btnReset.disabled = !hasTime;
        } else {
          btnStart.disabled = false;
          btnReset.disabled = false;
        }

        // Start 버튼이 Running이면 Pause로 보이게
        if (isRunning) {
          btnStart.classList.remove("blue");
          btnStart.classList.add("green");
          startText.textContent = "PAUSE";
          btnStart.querySelector("path").setAttribute("d",
            "M6 5h4v14H6zM14 5h4v14h-4z"
          );
        } else {
          btnStart.classList.remove("green");
          btnStart.classList.add("blue");
          startText.textContent = "START";
          btnStart.querySelector("path").setAttribute("d", "M8 5v14l11-7z");
        }
      }

      function stopTimer() {
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
        isRunning = false;
      }

      function resetAll() {
        stopTimer();
        totalSeconds = 0;

        // 입력 초기화(00 표시)
        inpH.value = "00";
        inpM.value = "00";
        inpS.value = "00";

        setInputsDisabled(false);
        updateButtons();
      }

      function tick() {
        totalSeconds -= 1;
        if (totalSeconds <= 0) {
          // 0초 되면 초기화 (요구사항 5)
          resetAll();
          return;
        }
        syncInputsFromTotal();
      }

      // 입력 UX: 숫자만, 2자리 패딩
      function normalizeField(input, max) {
        let v = input.value;

        // 숫자만 남기기
        v = String(v).replace(/[^\d]/g, "");
        if (v === "") v = "0";

        let n = clamp(parseInt(v, 10), 0, max);
        input.value = pad2(n);

        // 시간 재계산 반영
        totalSeconds = 0; // 입력중이면 "새 설정"으로 보기 위해 totalSeconds는 리셋
        updateButtons();
      }

      [inpH, inpM, inpS].forEach((el) => {
        el.addEventListener("focus", () => {
          // 커서 편하게: 00이면 비우고 입력하게
          if (el.value === "" || el.value === "00") el.value = "";
        });

        el.addEventListener("input", () => {
          if (isRunning) return; // 실행 중엔 입력 못 바꿈
          // 입력중에도 버튼 활성/비활성 반영
          updateButtons();
        });

        el.addEventListener("blur", () => {
          if (isRunning) return;
          if (el === inpH) normalizeField(inpH, 99);
          if (el === inpM) normalizeField(inpM, 59);
          if (el === inpS) normalizeField(inpS, 59);
        });
      });

      // Start / Pause 토글
      btnStart.addEventListener("click", () => {
        if (!isRunning) {
          // 시작
          totalSeconds = readTotalFromInputs();
          if (totalSeconds <= 0) return;

          syncInputsFromTotal();
          setInputsDisabled(true);

          isRunning = true;
          updateButtons();

          timerId = setInterval(tick, 1000);
        } else {
          // 일시정지 (요구사항 3)
          stopTimer();
          // 재시작은 다시 Start 누르면 됨 (요구사항 4)
          setInputsDisabled(false);
          // 정지 후에도 현재 값 유지
          updateButtons();
        }
      });

      btnReset.addEventListener("click", () => {
        // 초기화 (요구사항 6)
        resetAll();
      });

      // 최초 표시
      inpH.value = "00";
      inpM.value = "00";
      inpS.value = "00";
      updateButtons();
    </script>
  </body>
</html>
